name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: ['prefer-stable', 'prefer-lowest']
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          # Laravel 11 supports PHP up to 8.4
          - laravel: '11'
            php-versions: '8.5'
          # the lowest releases predate the newer PHP versions, they are checked on the lowest PHP
          - stability: 'prefer-lowest'
            php-versions: '8.4'
          - stability: 'prefer-lowest'
            php-versions: '8.5'

    name: PHP ${{ matrix.php-versions }}, Laravel ${{ matrix.laravel }}, ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Pin the Laravel version
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      # update instead of install, so an upstream release breaking the package shows up here
      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Check code style
        if: matrix.stability == 'prefer-stable' && matrix.laravel == '13'
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        if: matrix.stability == 'prefer-stable' && matrix.laravel == '13'
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run tests with PHPUnit
        run: ./vendor/bin/phpunit
